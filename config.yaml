# HC-RAG Configuration

# Model paths
models:
  text_encoder: "ProsusAI/finbert"
  table_encoder: "google/tapas-large-finetuned-wtq"
  generator: "deepseek-v4-flash"
  openai_base_url: "https://api.deepseek.com"
  openai_api_key: ""   # Set via OPENAI_API_KEY env var; do not commit secrets
  local_files_only: true  # Set false to allow HuggingFace downloads during model loading

# Index parameters
index:
  l1_document_k: 5
  l2_section_k: 10
  l3_semantic_k: 20
  use_sequential_expansion: true
  sequential_hops: 1
  sequential_neighbors_per_seed: 2
  chunk_size: 512
  chunk_overlap: 50

# Cross-modal alignment
alignment:
  embedding_dim: 768
  temperature: 0.07
  batch_size: 128
  epochs: 50
  learning_rate: 0.0001

# Fusion network
fusion:
  intent_classes: 4  # calculation, trend, fact, comparison
  hidden_dim: 256
  dropout: 0.2
  learning_rate: 0.0001
  batch_size: 64
  epochs: 30

# Generation
generation:
  max_tokens: 4096
  temperature: 0.0
  top_p: 1.0

# Paths
paths:
  data_dir: "./data"
  index_dir: "./indexes"
  checkpoint_dir: "./checkpoints"
  output_dir: "./outputs"
